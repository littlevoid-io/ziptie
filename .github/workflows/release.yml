name: Automated Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Package, Release, and Stage Publish
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to Support Staged Publishing
        run: npm install -g npm@latest

      - name: Install Project Dependencies
        run: bun install

      - name: Run All Project Test Suites
        run: bun run test

      - name: Compile Standalone Windows Executable
        run: bun run package

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release view "v$version" > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --title "ziptie v$version" --generate-notes
          }
          gh release upload "v$version" dist/ziptie.zip --clobber

      - name: Stage Publish to npm via OIDC
        run: npm stage publish
